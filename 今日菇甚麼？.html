<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>今日菇甚麼？</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one 16:9 pixel stage centred in the viewport; the joystick/A pad overlays it in landscape and sits under it in portrait; every menu is a full-screen panel. */
:root{
  --bg:#111c17; --panel:#1c2f25; --panel-2:#26402f; --line:#3a5a44; --ink:#eaf3dc; --muted:#9db7a1;
  --accent:#ffb43c; --accent-ink:#2a1a04; --danger:#ef5b47; --ok:#86dd5f; --gold:#ffd25a;
  --font-ui:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-px:'DotGothic16','Noto Sans TC',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--font-px);font-variant-numeric:tabular-nums}
.app{height:100%;display:flex;align-items:center;justify-content:center}
.stage{position:relative;container-type:inline-size;width:min(100%,calc((100dvh - 16px) * 16 / 9));aspect-ratio:16/9;background:#000;border:2px solid var(--line);box-shadow:0 0 0 2px #0a110d,0 14px 40px rgba(0,0,0,.5);touch-action:none}
@media (orientation:portrait){.stage{width:100%;align-self:flex-start;margin-top:4px}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;padding:1.3cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:1cqw}
.hud>*{pointer-events:auto}
.hl{display:flex;flex-direction:column;gap:.7cqw;min-width:0;max-width:56%}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:.7cqw}
.chip{font-size:clamp(9px,1.9cqw,15px);background:rgba(10,18,14,.8);border:2px solid var(--line);padding:.35em .7em;line-height:1.25}
.wxs{margin-left:.8em;color:var(--gold);font-weight:500}
.chip.obj{color:var(--gold);font-size:clamp(8px,1.6cqw,13px);max-width:100%}
.chip b{font-weight:900}
.stats{display:flex;gap:.7cqw}
.coin::before{content:"";display:inline-block;width:.9em;height:.9em;border-radius:50%;background:var(--gold);border:2px solid #9a6a10;margin-right:.4em;vertical-align:-.1em}
.bagbar{display:inline-block;width:3.2em;height:.6em;background:#0a110d;border:1px solid var(--line);margin-left:.4em;vertical-align:.05em}
.bagbar i{display:block;height:100%;background:var(--ok)}
.bagbar.full i{background:var(--danger)}
.hbtns{display:flex;gap:.6cqw}
.hbtn{font-size:clamp(9px,1.8cqw,14px);font-weight:700;background:var(--panel-2);border:2px solid var(--line);padding:.35em .7em;box-shadow:0 2px 0 #0a110d}
.hbtn:active{transform:translateY(2px);box-shadow:none}

.prompt{position:absolute;left:50%;bottom:1.6cqw;transform:translateX(-50%);background:rgba(10,18,14,.88);border:2px solid var(--gold);padding:.3em .9em;font-size:clamp(10px,2cqw,16px);font-weight:700;white-space:nowrap;pointer-events:none}
.prompt kbd{font-family:var(--font-px);background:var(--accent);color:var(--accent-ink);padding:0 .45em;margin-right:.5em}
.toasts{position:absolute;left:50%;top:17%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:80%}
.toast{background:rgba(10,18,14,.9);border:2px solid var(--line);padding:.3em .9em;font-size:clamp(10px,2cqw,15px);font-weight:700;animation:tin .25s ease-out,tout .4s ease-in 2.1s forwards;text-align:center}
.toast.good{border-color:var(--ok)}.toast.bad{border-color:var(--danger)}.toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;animation:ban 2.6s ease-out forwards;font-weight:900;font-size:clamp(16px,5cqw,40px);letter-spacing:.12em;text-shadow:3px 3px 0 #0a110d,-1px -1px 0 #0a110d,1px -1px 0 #0a110d,-1px 1px 0 #0a110d}
.banner small{display:block;font-size:.38em;letter-spacing:.1em;font-weight:500;color:var(--gold)}
@keyframes ban{0%{opacity:0;transform:translateY(10px)}15%,70%{opacity:1;transform:none}100%{opacity:0}}

.rbar{position:absolute;left:50%;bottom:7cqw;transform:translateX(-50%);display:flex;gap:.8em;align-items:center;background:rgba(10,18,14,.88);border:2px solid var(--gold);padding:.3em .9em;font-size:clamp(9px,1.8cqw,14px);font-weight:700;pointer-events:none;white-space:nowrap}
.rbar b{color:var(--gold)}
.stage.riding .hud,.stage.riding .keys,.stage.riding .pad,.stage.riding .prompt,.stage.riding .rbar,.stage.riding .toasts,.stage.riding .banner,.stage.riding .dlg{display:none!important}

/* touch pad */
.pad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:1.6cqw 2.6cqw;pointer-events:none}
.pad>*{pointer-events:auto}
@media (orientation:portrait){.pad{top:calc(100% + 14px);bottom:auto;padding:0 6px}}
.joy{--s:clamp(104px,19cqw,150px);width:var(--s);height:var(--s);border-radius:50%;background:rgba(10,18,14,.5);border:3px solid rgba(234,243,220,.4);position:relative;touch-action:none}
@media (orientation:portrait){.joy{--s:120px}}
.knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:var(--accent);border:3px solid #7a4a0a;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25)}
.abtn{--s:clamp(84px,15cqw,116px);width:var(--s);height:var(--s);border-radius:50%;background:var(--accent);color:var(--accent-ink);border:4px solid #7a4a0a;box-shadow:inset -5px -5px 0 rgba(0,0,0,.22),0 4px 0 #0a110d;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;touch-action:none;margin-right:1cqw}
@media (orientation:portrait){.abtn{--s:96px}}
.abtn b{font-family:var(--font-px);font-size:30px}
.abtn span{font-size:12px;font-weight:700}
.abtn.on{transform:translateY(3px);box-shadow:inset -5px -5px 0 rgba(0,0,0,.22)}
.tut-img{display:block;width:100%;image-rendering:pixelated;border:2px solid var(--line);margin-bottom:12px}
.tut-dots{text-align:center;margin-bottom:12px}
.tut-nav{display:flex;gap:8px;justify-content:space-between}
@media (max-height:520px){
 .sheet.tut{max-width:min(860px,100%)}
 .sheet.tut .sh{padding-top:6px;padding-bottom:6px}
 .sheet.tut .sh h2{font-size:15px}
 .tut-body{display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:14px;align-items:start}
 .tut-img{margin:0}
 .tut-txt h3{font-size:15px!important;margin-bottom:4px!important}
 .tut-txt .note{font-size:12.5px;line-height:1.55!important;margin-bottom:8px!important;padding:6px 10px}
 .tut-dots{margin-bottom:8px}
 .tut-nav .btn{padding:.4em .9em;font-size:13px}
}

.joy,.abtn{opacity:.5;transition:opacity .15s}
.joy:active,.abtn.on,.abtn:active{opacity:.85}
.keys{position:absolute;left:50%;transform:translateX(-50%);bottom:.4cqw;font-size:clamp(8px,1.4cqw,12px);color:var(--muted);pointer-events:none;display:none}
@media (hover:hover) and (pointer:fine) and (orientation:landscape){.keys{display:block}}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:.55em 1.1em;font-weight:900;border-radius:2px;box-shadow:0 3px 0 #8a5a12;letter-spacing:.04em}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 3px 0 #0a110d;border:2px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 3px 0 #7a1c10}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:.3em .7em;font-size:12px}

/* title */
.title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px max(16px,env(safe-area-inset-left,0px));text-align:center;overflow:auto;
  background:radial-gradient(120% 80% at 50% 110%,#1f4a2c 0%,#12251a 45%,#0b1410 100%)}
.title h1{margin:0;font-weight:900;font-size:clamp(34px,9vw,76px);letter-spacing:.06em;line-height:1.05;color:#ffe7a6;text-wrap:balance;
  text-shadow:4px 4px 0 #7a2a1a,8px 8px 0 #0a110d}
.title .sub{color:var(--muted);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
.tshelf{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap;max-width:560px}
.tshelf img{width:clamp(36px,9vw,64px);image-rendering:pixelated}
.tbtns{display:flex;flex-direction:column;gap:10px;min-width:220px}
.tbtns .btn{font-size:17px;padding:.7em 1.2em}
.disc{max-width:520px;color:var(--muted);font-size:12px;line-height:1.6}
.langs{display:flex;gap:6px;justify-content:center}
.langs button{background:var(--panel);border:2px solid var(--line);padding:.3em .9em;font-weight:700}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:#8a5a12}

/* dialog */
.dlg{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(780px,calc(100% - 32px));z-index:30;background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #0a110d,0 10px 30px rgba(0,0,0,.5);padding:20px 18px 12px;min-height:110px;cursor:pointer}
.dlg .who{position:absolute;top:-17px;left:12px;background:var(--accent);color:var(--accent-ink);padding:1px 12px;font-weight:900;border:2px solid #8a5a12}
.dlg p{margin:0;font-size:clamp(14px,2.4vw,18px);line-height:1.7;min-height:3.4em}
.dlg .more{position:absolute;right:12px;bottom:6px;color:var(--gold);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* modals */
.modal{position:fixed;inset:0;z-index:20;background:rgba(6,12,9,.84);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));touch-action:pan-y;-webkit-user-select:text;user-select:text}
.modal.top{z-index:25}
.sheet{width:100%;max-width:960px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #0a110d,6px 6px 0 rgba(0,0,0,.45);animation:pop .16s ease-out}
.sheet.narrow{max-width:520px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--panel-2);border-bottom:3px solid var(--line)}
.sh h2{margin:0;font-size:18px;font-weight:900;letter-spacing:.06em}
.sh .meta{color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sb{padding:14px;overflow:auto;min-height:0;flex:1}
.x{background:none;border:2px solid var(--line);width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--panel-2);border:2px solid var(--line);padding:.25em .8em;font-size:13px;font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:#8a5a12}
.bar{height:10px;background:#0a110d;border:2px solid var(--line);min-width:90px}
.bar i{display:block;height:100%;background:var(--ok)}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{background:var(--panel-2);border:2px solid var(--line);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:700;font-size:13px;min-width:0}
button.card:hover{border-color:var(--gold)}
.card small{font-weight:500;color:var(--muted);font-size:11px;font-style:italic;overflow-wrap:anywhere}
.card.lock img{filter:brightness(0);opacity:.3}
.card.lock{color:var(--muted)}
.badge{display:inline-block;padding:0 .6em;font-size:11px;font-weight:900;border:2px solid;line-height:1.5}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--danger);border-color:var(--danger)}
.badge.warn{color:var(--accent);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow small{display:block;color:var(--muted);font-size:12px;font-style:italic}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
.ribbon{background:var(--danger);color:#fff;font-weight:900;letter-spacing:.12em;text-align:center;padding:2px 0}
.detail{display:flex;gap:16px;align-items:flex-start}
.detail .pic{background:#0f1b15;border:3px solid var(--line);padding:12px;flex:none}
.detail h3{margin:0;font-size:22px;font-weight:900}
.detail .sci{color:var(--muted);font-style:italic;margin:2px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.note{background:#0f1b15;border-left:4px solid var(--gold);padding:8px 10px;font-size:13px}
@media (max-width:520px){.detail{flex-direction:column;align-items:center;text-align:left}}

/* kitchen */
.kgrid{display:grid;grid-template-columns:minmax(170px,.7fr) minmax(0,1.6fr);gap:14px}
@media (max-width:700px){.kgrid{grid-template-columns:1fr}}
.rlist{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;max-height:calc(100dvh - 120px);overflow:auto}
@media (max-width:700px){.rlist{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px}.rlist .rbtn{flex:none;min-width:150px}}
.rbtn{text-align:left;background:var(--panel-2);border:2px solid var(--line);padding:6px 9px;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.rbtn[aria-pressed="true"]{border-color:var(--gold);background:#31503b}
.rbtn small{font-weight:500;color:var(--muted);font-size:11px}
.rbtn.off{opacity:.55}
.rbtn .st{color:var(--gold)}
.kcv{width:100%;max-width:480px;aspect-ratio:160/96;image-rendering:pixelated;border:3px solid var(--line);display:block;background:#2a1c14}
.slid{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,2.2fr) 58px;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.slid output{font-family:var(--font-px);text-align:right}
.slid small{color:var(--gold);display:block;font-size:11px}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.heats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}
.hb{background:var(--panel-2);border:2px solid var(--line);padding:4px 0 5px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.hb i{display:block;width:70%;background:linear-gradient(#ffd36a,#ff7a1a);border:1px solid #8a3a08}
.hb[aria-pressed="true"]{border-color:var(--gold);background:#4a3a1a}
.hint{color:var(--muted);font-size:12px}
.cooking{pointer-events:none;opacity:.7}
.res{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.face{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--line);background:#0f1b15;flex:none}
.stars{font-size:30px;letter-spacing:.1em;color:var(--gold);line-height:1}
.stars s{text-decoration:none;color:#3a4a3f}
.say{background:#0f1b15;border:2px solid var(--line);padding:10px 12px;font-size:14px;margin:10px 0}
.pay{font-weight:900;font-size:20px;color:var(--gold)}
.rcard{border:4px double var(--gold);background:linear-gradient(160deg,#2a2412,#1a2a1f);padding:14px 16px;position:relative}
.rcard h3{margin:0 0 2px;font-size:20px;font-weight:900;color:var(--gold)}
.rcard .stamp{position:absolute;right:12px;top:10px;border:3px solid var(--danger);color:var(--danger);font-weight:900;padding:0 .5em;transform:rotate(8deg);letter-spacing:.1em;font-size:13px}
.rcard ul{list-style:none;margin:10px 0 0;padding:0}
.rcard li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed #5a5030;padding:3px 0}
.menu-b{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.howto{font-size:13px;color:var(--muted);line-height:1.7}
.howto b{color:var(--ink)}
.rot{display:none;position:fixed;left:0;right:0;top:0;z-index:5;text-align:center;font-size:12px;color:var(--gold);padding-top:2px}
@media (orientation:portrait){.rot{display:block}}
@media (prefers-reduced-motion:reduce){.toast,.banner,.sheet{animation-duration:.01s}}
</style>

</div>

<div class="title" id="title">

<script>
'use strict';
/* ============ i18n ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const BAGMAX=5,STOREMAX=5;

const storeCap=()=>40+20*(S.up&&S.up.store||0);
const storeCount=()=>Object.values(S.store||{}).reduce((a,b)=>a+b,0);
const UPCOST={bag:[120,240,400,600,900],store:[100,200,350,550,800]};
function upgradeRows(){
 return ['bag','store'].map(k=>{
  const lv=S.up[k],mx=k==='bag'?BAGMAX:STOREMAX,cur=k==='bag'?bagCap():storeCap(),nx=cur+(k==='bag'?5:20),cost=UPCOST[k][lv],max=lv>=mx;

function buyUpgrade(k){

function openStore(){
 if(findModal('store'))return;
 openModal({kind:'store',narrow:true,
  render:()=>{
   const ids=SP.filter(s=>S.bag[s.id]||S.store[s.id]);
   const rows=ids.map(s=>{const b=S.bag[s.id]||0,w=S.store[s.id]||0;
    return `<div class="row">${img(s.id,40)}<div class="grow"><b>${tx(s.name)}</b> ${badge(s)}<small>${t('storeBag')} ×<span class="num">${b}</span> · ${t('storeBox')} ×<span class="num">${w}</span></small></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><button class="btn sm" type="button" data-dep="${s.id}" ${b?'':'disabled'}>${t('dep1')}</button><button class="btn ghost sm" type="button" data-depall="${s.id}" ${b?'':'disabled'}>${t('depAll')}</button><button class="btn sm" type="button" data-wd="${s.id}" ${w?'':'disabled'}>${t('wd1')}</button><button class="btn ghost sm" type="button" data-wdall="${s.id}" ${w?'':'disabled'}>${t('wdAll')}</button></div></div>`}).join('');
   return hdr(t('storeTitle'),`<span class="num">${t('storeBag')} ${bagCount()}/${bagCap()}</span> · <span class="num">${t('storeBox')} ${storeCount()}/${storeCap()}</span>`)+`<div class="sb">${rows||`<div class="empty">${t('storeEmpty')}</div>`}</div>`},
  click:(e,m)=>{
   const q=a=>e.target.closest(a);let id,n=0,dir=0;
   if(q('[data-dep]')){id=q('[data-dep]').dataset.dep;n=1;dir=1}else if(q('[data-depall]')){id=q('[data-depall]').dataset.depall;n=99;dir=1}
   else if(q('[data-wd]')){id=q('[data-wd]').dataset.wd;n=1;dir=-1}else if(q('[data-wdall]')){id=q('[data-wdall]').dataset.wdall;n=99;dir=-1}
   if(!dir)return;
   if(dir>0){n=Math.min(n,S.bag[id]||0,storeCap()-storeCount());if(n<=0){toast(t('storeFull'),'bad');sfx('err');return}
    S.bag[id]-=n;if(S.bag[id]<=0)delete S.bag[id];S.store[id]=(S.store[id]||0)+n}
   else{n=Math.min(n,S.store[id]||0,bagCap()-bagCount());if(n<=0){toast(t('bagFull',bagCount()),'bad');sfx('err');return}
    S.store[id]-=n;if(S.store[id]<=0)delete S.store[id];S.bag[id]=(S.bag[id]||0)+n}
   sfx('tick');save();hud();m.draw()}});
}

/* ---- night thieves: masked raccoons ---- */
const FOE={list:[],spawnT:10,cd:0,swing:0,sdx:1,sdy:0,hurt:0,warned:false};
const foeActive=()=>G.started&&['meadow','vforest','dforest','home'].includes(G.map)&&dayLight()<.25;
function foeFree(x,y){
 const W=WORLD[G.map],tx=Math.floor(x/16),ty=Math.floor(y/16);
 if(tx<1||ty<1||tx>=W.W-1||ty>=W.H-1)return false;if(isSolid(tx,ty))return false;
 if(G.map==='home'&&x<18*16&&y<13*16)return false;return true;
}
function foeNear(r){return FOE.list.some(f=>Math.hypot(f.x-G.x,f.y-G.y)<=r)}
function poof(x,y,c){for(let i=0;i<8;i++)G.fx.push({x,y:y-6,vx:rnd(-40,40),vy:rnd(-50,-10),life:.5,c:pick(c||['#c8ccd2','#fff','#8a8f98'])})}
function spawnFoe(){
 for(let i=0;i<16;i++){const a=rnd(0,6.283),d=rnd(175,230),x=G.x+Math.cos(a)*d,y=G.y+Math.sin(a)*d;
  if(foeFree(x,y)){FOE.list.push({x,y,hp:2,st:'stalk',stun:0,kx:0,ky:0,loot:0,flash:0,wob:rnd(0,6),face:1,age:0,t:0});
   if(!FOE.warned){FOE.warned=true;toast(t('foeWarn'))}return}}
}
function foeMove(f,vx,vy,dt){
 const nx=f.x+vx*dt;if(foeFree(nx,f.y))f.x=nx;const ny=f.y+vy*dt;if(foeFree(f.x,ny))f.y=ny;
 if(Math.abs(vx)>2)f.face=vx>0?1:-1;
}
function foeUpdate(dt,busy){
 if(!foeActive()){if(dayLight()>.6)FOE.warned=false;if(FOE.list.length){FOE.list.forEach(f=>poof(f.x,f.y));FOE.list=[]}FOE.hurt=Math.max(0,FOE.hurt-dt);return}
 FOE.hurt=Math.max(0,FOE.hurt-dt);FOE.swing=Math.max(0,FOE.swing-dt);FOE.cd=Math.max(0,FOE.cd-dt);
 if(busy)return;
 const mx=G.map==='home'?1:G.map==='dforest'?3:2;
 FOE.spawnT-=dt;if(FOE.spawnT<=0){FOE.spawnT=rnd(9,15);if(FOE.list.filter(f=>f.st==='stalk').length<mx)spawnFoe()}
 for(let i=FOE.list.length-1;i>=0;i--){
  const f=FOE.list[i];f.age+=dt;f.wob+=dt*8;f.flash=Math.max(0,f.flash-dt);
  const dx=G.x-f.x,dy=G.y-f.y,d=Math.hypot(dx,dy)||1;
  if(f.stun>0){f.stun-=dt;foeMove(f,f.kx,f.ky,dt);f.kx*=.9;f.ky*=.9;continue}
  if(f.st==='stalk'){
   const sp=G.map==='dforest'?36:32,zig=Math.sin(f.age*2.2+f.wob*.1)*.45;
   foeMove(f,(dx/d-dy/d*zig)*sp,(dy/d+dx/d*zig)*sp,dt);
   if(d<10){
    if(S.money>0){const amt=Math.max(3,Math.min(S.money,Math.round(S.money*rnd(.15,.25))));S.money-=amt;f.loot=amt;toast(t('foeStole',amt),'bad');sfx('steal');FOE.hurt=.4;hud();save()}
    else toast(t('foeNone'));
    f.st='flee';f.t=0}
  }else{
   f.t+=dt;foeMove(f,-dx/d*52,-dy/d*52,dt);
   if(d>230||f.t>14){if(f.loot)toast(t('foeLost'),'bad');poof(f.x,f.y);FOE.list.splice(i,1)}
  }
 }
}
function foeStrike(){
 if(!FOE.list.length)return false;
 const near=FOE.list.filter(f=>Math.hypot(f.x-G.x,f.y-G.y)<=30);if(!near.length)return false;
 if(FOE.cd>0)return true;
 FOE.cd=.4;FOE.swing=.18;sfx('swoosh');
 const dv={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[G.dir];FOE.sdx=dv[0];FOE.sdy=dv[1];
 for(const f of near){
  const dx=f.x-G.x,dy=f.y-G.y,d=Math.hypot(dx,dy)||1;
  f.hp=f.st==='flee'?0:f.hp-1;f.flash=.25;f.stun=.45;f.kx=dx/d*110;f.ky=dy/d*110;sfx('hit');
  if(f.hp<=0){
   const back=f.loot,gain=back+3;S.money+=gain;S.sold=S.sold;poof(f.x,f.y,['#ffd25a','#fff','#ffb43c']);
   toast(back?t('foeBack',back):t('foeKill'),'gold');sfx('coin');FOE.list.splice(FOE.list.indexOf(f),1);hud();save();
  }
 }
 return true;
}
function drawFoe(f,cx,cy){
 const sx=Math.round(f.x-cx),sy=Math.round(f.y-cy);if(sx<-20||sx>340||sy<-10||sy>200)return;
 const fc=f.face,bob=Math.round(Math.sin(f.wob)*.8),step=Math.floor(f.wob/1.2)&1;
 ctx.globalAlpha=Math.min(1,f.age/.7);
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(sx-6,sy-1,12,2);
 const body=f.flash>0?'#ffffff':'#7d838c',head=f.flash>0?'#ffffff':'#8e949c';
 for(let i=0;i<4;i++){const px=fc>0?sx-8-i*2:sx+7+i*2;R(ctx,px,sy-7-(i&1?0:1)+bob,2,3,i&1?'#2a2e36':'#aab0b8')}
 R(ctx,sx-5,sy-8+bob,10,6,body);R(ctx,sx-3,sy-6+bob,6,3,'#aab0b8');
 R(ctx,sx-4,sy-3-step,2,3+step,'#4a4e56');R(ctx,sx+2,sy-3-(1-step),2,3+(1-step),'#4a4e56');
 const hx=sx+fc*2;
 R(ctx,hx-4,sy-13+bob,8,6,head);R(ctx,hx-4,sy-15+bob,2,2,head);R(ctx,hx+2,sy-15+bob,2,2,head);
 R(ctx,hx-4,sy-11+bob,8,2,'#23262d');R(ctx,hx-3+(fc>0?1:0),sy-10+bob,1,1,'#fff');R(ctx,hx+1+(fc>0?1:0),sy-10+bob,1,1,'#fff');
 R(ctx,hx+(fc>0?1:-1),sy-8+bob,2,2,'#d8dce2');R(ctx,hx+(fc>0?2:-1),sy-8+bob,1,1,'#23262d');
 if(f.loot){R(ctx,hx-2,sy-19+bob,5,4,'#c89a50');R(ctx,hx-1,sy-18+bob,3,2,'#ffd25a');R(ctx,hx,sy-20+bob,1,1,'#8a5a30')}
 ctx.globalAlpha=1;
}
function foeEyes(cx,cy){
 if(!FOE.list.length)return;
 for(const f of FOE.list){const sx=Math.round(f.x-cx),sy=Math.round(f.y-cy),hx=sx+f.face*2,bob=Math.round(Math.sin(f.wob)*.8);
  ctx.globalCompositeOperation='lighter';glowAt(hx,sy-10+bob,9,'#ffb040',.22);ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=Math.min(1,f.age/.7);ctx.fillStyle=f.st==='stalk'?'#ffe060':'#fff';ctx.fillRect(hx-3+(f.face>0?1:0),sy-10+bob,1,1);ctx.fillRect(hx+1+(f.face>0?1:0),sy-10+bob,1,1);ctx.globalAlpha=1}
}
function foeFx(cx,cy){
 if(FOE.swing>0){const sx=Math.round(G.x-cx+FOE.sdx*13),sy=Math.round(G.y-cy-7+FOE.sdy*10),k=FOE.swing/.18;ctx.globalAlpha=k;ctx.fillStyle='#fff';
  if(FOE.sdx)for(let i=-5;i<=5;i++)ctx.fillRect(sx+Math.round(FOE.sdx*(5-Math.abs(i)*.5)),sy+i,1,1);else for(let i=-5;i<=5;i++)ctx.fillRect(sx+i,sy+Math.round(FOE.sdy*(5-Math.abs(i)*.5)),1,1);ctx.globalAlpha=1}
}
function foeHurt(){if(FOE.hurt>0){ctx.globalAlpha=Math.min(.35,FOE.hurt);ctx.fillStyle='#d83a2a';ctx.fillRect(0,0,320,180);ctx.globalAlpha=1}}

 ctx.fillStyle='#4a4a52';ctx.fillRect(0,150,320,3);ctx.fillStyle='#8a8f98';ctx.fillRect(0,148,320,2);
 for(let i=0;i<20;i++){const x=(((i*26-t_*300)%520)+520)%520-30;ctx.fillStyle='#4a3828';ctx.fillRect(x,153,12,3)}

 ctx.restore();
 ctx.fillStyle='#3a2a1c';ctx.fillRect(0,0,320,14);ctx.fillRect(0,0,16,180);ctx.fillRect(304,0,16,180);ctx.fillRect(158,0,4,180);

 const a=t_<.6?1-t_/.6:t_>r.dur-.6?(t_-(r.dur-.6))/.6:0;if(a>0){ctx.fillStyle=`rgba(5,9,7,${Math.min(1,a)})`;ctx.fillRect(0,0,320,180)}

/* ---- restaurant round ---- */
const ROUND={on:false,t:0,dur:100,custs:[],spawnT:0,earn:0,served:0,missed:0,exp0:0,lv0:1,perf:[],floats:[],hold:null};
const SEATS=[];[5,9,13,17].forEach(tx_=>[4,8].forEach(ty=>SEATS.push({x:tx_*16+8,y:ty*16+13,tx:tx_,ty,used:false,plate:null})));
const SHIRTS=['#d86a8f','#3f6fb5','#e8a02f','#6aa84f','#8a5ac8','#c8503a','#3aa0a0'];
function seatPath(s){const ax=11*16+8,p=[[ax,12*16+4],[ax,11*16+8],[ax,7*16+8]];if(s.ty===4)p.push([ax,3*16+8],[s.x,3*16+8],[s.x,s.y]);else p.push([s.x,7*16+8],[s.x,s.y]);return p}
function startRound(){
 if(ROUND.on)return;
 if(!S.dishes.length){toast(t('trayEmpty'),'bad');sfx('err');return}
 Object.assign(ROUND,{on:true,t:0,custs:[],spawnT:1.5,earn:0,served:0,missed:0,exp0:S.exp||0,lv0:lvOf(S.exp||0),perf:[],floats:[],hold:null});
 SEATS.forEach(s=>{s.used=false;s.plate=null});
 banner(t('roundStart'));sfx('good');$('rbar').hidden=false;
}
function spawnCust(){
 const free=SEATS.filter(s=>!s.used);if(!free.length)return;
 const cnt={};S.dishes.forEach(d=>cnt[d.rid]=(cnt[d.rid]||0)+1);
 ROUND.custs.forEach(c=>{if(c.st==='walk'||c.st==='wait')cnt[c.want]=(cnt[c.want]||0)-1});
 const opts=Object.keys(cnt).filter(k=>cnt[k]>0);if(!opts.length)return;
 const s=pick(free);s.used=true;const ci=Math.floor(Math.random()*CUST.length),cu=CUST[ci],lv=lvOf(S.exp||0);
 const want=pick(opts);
 const pts=seatPath(s),pm=Math.max(20,32-lv);
 ROUND.custs.push({ci,cu,s,want,st:'walk',x:pts[0][0],y:pts[0][1],wp:pts.slice(1),pat:pm,pmax:pm,eat:0,dir:'up',anim:0,mood:0,
  pal:{shirt:pick(SHIRTS),pants:'#4a4a60',hair:cu.hair,skin:cu.skin,hat:null,pack:null,bun:false}});
}
function leaveCust(c,mood){
 c.st='leave';c.mood=mood;c.wp=seatPath(c.s).slice().reverse().slice(1);c.s.plate=null;
 if(mood<0){ROUND.floats.push({x:c.x,y:c.y-24,t:2,kind:'angry'});sfx('bad')}
}
function nearCust(){let b=null,bd=26;for(const c of ROUND.custs){if(c.st!=='wait')continue;const d=Math.hypot(c.x-G.x,c.y-G.y);if(d<bd){bd=d;b=c}}return b}
function roundPrompt(){
 if(!ROUND.on||G.map!=='restaurant')return '';
 const c=nearCust();if(!c)return '';
 return S.dishes.some(d=>d.rid===c.want)?t('pServe',tx(RCM[c.want].name)):(S.dishes.length?t('pServeAny'):'');
}
function roundUpdate(dt){
 if(!ROUND.on)return;
 ROUND.t+=dt;const empty=!S.dishes.length;
 ROUND.spawnT-=dt;
 const active=ROUND.custs.filter(c=>c.st==='walk'||c.st==='wait').length,maxC=lvOf(S.exp||0)>=4?5:4;
 if(ROUND.t<ROUND.dur&&!empty&&ROUND.spawnT<=0&&active<Math.min(maxC,S.dishes.length)){ROUND.spawnT=rnd(5.5,8);spawnCust()}
 for(const c of ROUND.custs){
  c.anim+=dt*8;
  if(c.st==='walk'||c.st==='leave'){
   const w=c.wp[0];if(!w){c.st==='walk'?(c.st='wait'):(c.gone=true);continue}
   const dx=w[0]-c.x,dy=w[1]-c.y,d=Math.hypot(dx,dy),step=46*dt;
   if(d<=step){c.x=w[0];c.y=w[1];c.wp.shift();if(!c.wp.length){if(c.st==='walk'){c.st='wait';c.dir='down'}else{c.gone=true}}}
   else{c.x+=dx/d*step;c.y+=dy/d*step;c.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
  }else if(c.st==='wait'){c.pat-=dt;if(empty)leaveCust(c,0);else if(c.pat<=0){ROUND.missed++;leaveCust(c,-1)}}
  else if(c.st==='eat'){c.eat-=dt;if(c.eat<=0)leaveCust(c,c.mood)}
 }
 ROUND.custs=ROUND.custs.filter(c=>{if(c.gone){c.s.used=false;c.s.plate=null;return false}return true});
 ROUND.floats=ROUND.floats.filter(f=>(f.t-=dt)>0);
 const nc=nearCust();ROUND.hold=nc&&S.dishes.some(d=>d.rid===nc.want)?nc.want:(S.dishes[0]?S.dishes[0].rid:null);
 const el=$('rtime');if(el){el.textContent=Math.max(0,Math.ceil(ROUND.dur-ROUND.t))+'s';$('rinfo').textContent=t('rbarInfo',ROUND.earn,ROUND.served,S.dishes.length)}
 if(!ROUND.custs.length&&(ROUND.t>=ROUND.dur||empty))endRound(false);
}
function roundServe(){
 if(!ROUND.on||G.map!=='restaurant')return false;
 const c=nearCust();if(!c)return false;
 if(!S.dishes.length){toast(t('noDish'),'bad');sfx('err');return true}
 let i=S.dishes.findIndex(d=>d.rid===c.want),sub=false;if(i<0){i=0;sub=true}
 const d=S.dishes.splice(i,1)[0],r=RCM[d.rid],perfect=d.perfect&&!sub;
 const eff=Math.round(d.score*(sub?.5:1)),stars=perfect?5:eff>=85?4:eff>=65?3:eff>=40?2:1;
 const bonus=1+.3*Math.max(0,c.pat)/c.pmax;
 let money=eff<25?0:Math.round(r.price*Math.pow(eff/100,2)*c.cu.m*(perfect?1.5:1)*bonus);
 const isBest=!sub&&(!S.bestCfg[r.id]||d.score>S.bestCfg[r.id].score);
 if(!S.best[r.id]||d.score>S.best[r.id])S.best[r.id]=d.score;
 if(isBest){
  S.bestCfg[r.id]={score:d.score,A:d.A,oil:d.oil,heat:d.heat};
  const others=CUST.map((_,i)=>i).filter(i=>i!==c.ci).sort(()=>Math.random()-.5).slice(0,2);
  S.reviews[r.id]=[c.ci].concat(others).map((ci_,k)=>({c:ci_,stars,A:d.A,oil:d.oil,heat:d.heat,k}));
 }
 if(perfect&&!S.perfect[r.id]){S.perfect[r.id]=true;money+=50;ROUND.perf.push(r.id)}
 S.money+=money;ROUND.earn+=money;ROUND.served++;S.served=(S.served||0)+1;gainExp(Math.round(eff/7)+(perfect?12:0));
 c.st='eat';c.eat=2.6;c.mood=stars;c.s.plate=d.rid;ROUND.floats.push({x:c.x,y:c.y-24,t:2.2,kind:'rate',stars,money});
 for(let k=0;k<8;k++)G.fx.push({x:c.x,y:c.y-12,vx:rnd(-30,30),vy:rnd(-50,-15),life:.6,c:pick(['#ffd25a','#fff','#ffb43c'])});
 sfx(stars>=5?'perfect':stars>=3?'good':'bad');if(money)sfx('coin');
 if(sub)toast(t('serveWrong'),'bad');
 save();hud();checkEnding();return true;
}
function endRound(){
 if(!ROUND.on)return;ROUND.on=false;
 ROUND.custs.forEach(c=>poof(c.x,c.y));ROUND.custs=[];SEATS.forEach(s=>{s.used=false;s.plate=null});$('rbar').hidden=true;
 const lv1=lvOf(S.exp||0),R_={earn:ROUND.earn,served:ROUND.served,missed:ROUND.missed,exp:(S.exp||0)-ROUND.exp0,lv0:ROUND.lv0,lv1,perf:ROUND.perf.slice()};
 save();hud();
 openModal({kind:'round',narrow:true,
  render:()=>{
   const up=lv1>R_.lv0,unl=up?unlockText(R_.lv0,lv1):'';
   const body=R_.served?`<div class="row"><div class="grow"><b>${t('rsServed')}</b></div><span class="num">${R_.served}</span></div><div class="row"><div class="grow"><b>${t('rsMissed')}</b></div><span class="num">${R_.missed}</span></div><div class="row"><div class="grow"><b>${t('rsEarn')}</b></div><span class="num coin">${R_.earn}</span></div><div class="row"><div class="grow"><b>${t('rsExp')}</b></div><span class="num">+${R_.exp}</span></div>`:`<div class="empty">${t('rsNone')}</div>`;
   return hdr(t('roundEnd'))+`<div class="sb">${body}${up?`<p class="pay" style="color:var(--ok);margin:12px 0 4px">${t('rsLevelUp',lv1)}</p>${unl?`<p class="note">${t('rsUnlock',unl)}</p>`:''}`:''}${R_.perf.length?`<p class="pay" style="color:var(--gold);margin:12px 0 6px">${t('rsPerfect')}</p>${R_.perf.map(id=>cardHTML(RCM[id])).join('')}`:''}<p class="hint" style="margin-top:12px">${t('rsBook')}</p><div style="text-align:right;margin-top:10px"><button class="btn" type="button" data-close>${t('close')}</button></div></div>`}});
}

/* ---- restaurant drawing ---- */
const DIG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111','000010111010000'];
function drawNum(x,y,str,col){ctx.fillStyle=col;for(let i=0;i<str.length;i++){const gl=DIG[str[i]==='+'?10:+str[i]];for(let k=0;k<15;k++)if(gl[k]==='1')ctx.fillRect(x+i*4+(k%3),y+((k/3)|0),1,1)}}

function drawCust(c,cx,cy){

 if(!sit){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(sx-5,sy-1,10,2)}
 drawChar(ctx,sx,sit?sy+1:sy,sit?'down':c.dir,sit?0:[0,1,0,3][Math.floor(c.anim)%4],c.pal);

function npcUpdate(dt){
 const W=WORLD[G.map];if(!W)return;
 for(const n of W.npcs){if(!n.walk)continue;
  if(n.wt>0){n.wt-=dt;n.mv=false;continue}
  if(n.tx==null){const a=rnd(0,6.283),d=rnd(16,n.r*16);n.tx=n.hx+Math.cos(a)*d;n.ty=n.hy+Math.sin(a)*d;
   const gx=Math.floor(n.tx/16),gy=Math.floor(n.ty/16);if(gx<2||gy<2||gx>=W.W-2||gy>=W.H-2||isSolid(gx,gy)){n.tx=null;n.wt=.3;continue}}
  const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);
  if(d<2){n.tx=null;n.wt=rnd(1.5,4);n.mv=false;continue}
  const sp=22,nx=n.x+dx/d*sp*dt,ny=n.y+dy/d*sp*dt;
  if(isSolid(Math.floor(nx/16),Math.floor(ny/16))||Math.hypot(nx-G.x,ny-G.y)<12){n.tx=null;n.wt=rnd(.5,1.5);n.mv=false;continue}
  n.x=nx;n.y=ny;n.mv=true;n.anim+=dt*6;n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
 }
}

const defState=()=>({money:0,bag:{},codex:{},perfect:{},best:{},cooked:0,sold:0,intro:false,map:'home',x:184,y:168,sfx:true,music:true,ended:false,tod:.3,up:{bag:0,store:0},store:{},dishes:[],exp:0,pantry:Object.assign({},START_PANTRY),hstock:[],pv:2,reviews:{},bestCfg:{},served:0});
let S=defState();
function loadSave(){try{const j=localStorage.getItem(SAVEKEY);if(j){const o=Object.assign(defState(),JSON.parse(j));if(!o.pv){o.pantry=o.pantry||{};for(const k in START_PANTRY)if(o.pantry[k]===undefined)o.pantry[k]=START_PANTRY[k];o.pv=2}if(!o.hstock)o.hstock=[];if(o.map==='city'){o.map='market';o.x=19*16;o.y=11*16}return o}}catch(e){}return null}
function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify(S))}catch(e){}}
const bagCount=()=>Object.values(S.bag).reduce((a,b)=>a+b,0);
const G={started:false,map:'home',x:184,y:168,dir:'down',moving:false,anim:0,time:0,mush:{},left:{},target:null,fade:null,dlg:null,spawnT:4,amb:[],fx:[],crit:[],clouds:[],lastStep:-1,inK:0,tod:.3,phase:'',clkM:-1,cam:{x:0,y:0},saveT:15};
const MK={mult:{},prev:{},next:0};
function marketTick(first){SP.forEach(s=>{if(s.edible)return;const p=MK.mult[s.id]||1;MK.prev[s.id]=p;MK.mult[s.id]=first?rnd(.8,1.3):clamp(p+rnd(-.3,.3),.6,1.6)});MK.next=G.time+100;if(first){if(!S.hstock.length)homeRestock()}else{MK.n=(MK.n||0)+1;if(MK.n%3===0)homeRestock()}}
const priceOf=id=>Math.round(SPM[id].price*(MK.mult[id]||1));

/* ============ small UI helpers ============ */
function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;const box=$('toasts');box.appendChild(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>el.remove(),2600)}
function banner(a,b){const el=document.createElement('div');el.className='banner';el.innerHTML=`${a}<small>${b||''}</small>`;$('stage').appendChild(el);setTimeout(()=>el.remove(),2700)}
const hdr=(title,meta='')=>`<div class="sh"><h2>${title}</h2><div class="meta">${meta}<button class="x" type="button" data-close aria-label="${t('close')}">✕</button></div></div>`;
const img=(id,px)=>`<img class="px" src="${sprURL(id)}" width="${px}" height="${px}" alt="">`;
const badge=s=>`<span class="badge ${s.status==='edible'?'ok':s.status==='inedible'?'warn':'bad'}">${t('st')[s.status]}</span>`;
const unitM=()=>lang==='zh'?'朵':'pcs';

const MS=[];
function openModal(spec){
 const el=document.createElement('div');el.className='modal'+(spec.top?' top':'');
 const sheet=document.createElement('div');sheet.className='sheet'+(spec.narrow?' narrow':'')+(spec.cls?' '+spec.cls:'');el.appendChild(sheet);document.body.appendChild(el);
 const m=Object.assign({el,sheet},spec);MS.push(m);
 m.draw=()=>{const sb=sheet.querySelector('.sb'),sc=sb?sb.scrollTop:0;sheet.innerHTML=spec.render(m);const nb=sheet.querySelector('.sb');if(nb)nb.scrollTop=sc;if(spec.after)spec.after(m)};
 el.addEventListener('pointerdown',e=>{if(e.target===el&&!spec.nobg)closeModal(m)});
 el.addEventListener('click',e=>{if(e.target.closest('[data-close]')){closeModal(m);return}if(spec.click)spec.click(e,m)});
 el.addEventListener('input',e=>{if(spec.input)spec.input(e,m)});
 m.draw();return m;
}
function closeModal(m){if(m.locked&&m.locked())return;const i=MS.indexOf(m);if(i<0)return;MS.splice(i,1);m.el.remove();if(m.onClose)m.onClose();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
const findModal=k=>MS.find(m=>m.kind===k);

 if(findModal('codex'))return;
 openModal({kind:'codex',tab:tab||'all',
  render:m=>{
   const list=SP.filter(s=>m.tab==='all'||s.map===m.tab),found=SP.filter(s=>S.codex[s.id]).length;
   const tabs=['all',...MAP_ORDER].map(k=>`<button class="tab" type="button" data-tab="${k}" aria-selected="${m.tab===k}">${t('mapShort')[k]}</button>`).join('');
   const cards=list.map(s=>S.codex[s.id]
     ?`<button class="card" type="button" data-sp="${s.id}">${img(s.id,48)}<span>${tx(s.name)}</span><small>${s.sci}</small>${badge(s)}</button>`
     :`<button class="card lock" type="button" data-sp="${s.id}">${img(s.id,48)}<span>${t('unknown')}</span></button>`).join('');
   return hdr(t('dexTitle'),`<span class="num">${found}/${SP.length}</span><span class="bar"><i style="width:${found/SP.length*100}%"></i></span>`)+`<div class="sb"><div class="tabs" role="tablist">${tabs}</div><div class="grid">${cards}</div></div>`},
  click:(e,m)=>{const tb=e.target.closest('[data-tab]');if(tb){m.tab=tb.dataset.tab;m.draw();return}const c=e.target.closest('[data-sp]');if(c)openDetail(c.dataset.sp,false)}});
}
function openDetail(id,isNew){
 if(isNew)sfx('new');
 openModal({kind:'detail',top:true,narrow:true,
  render:()=>{
   const s=SPM[id],known=!!S.codex[id];
   let body;
   if(!known)body=`<div class="detail"><div class="pic card lock" style="border:3px solid var(--line)">${img(id,96)}</div><div><h3>${t('unknown')}</h3><p class="note">${t('unlockHint',t('map')[s.map])}</p></div></div>`;
   else{
    const uses=RC.filter(r=>r.sp===id).map(r=>tx(r.name)).join('、');
    const price=s.edible?`<dt>${t('kvUse')}</dt><dd>${uses}</dd>`:`<dt>${t('kvPrice')}</dt><dd><span class="num">${s.price}</span> · ${t('priceNow')} <span class="num">${priceOf(id)}</span></dd>`;
    body=`<div class="detail"><div class="pic">${img(id,96)}</div><div style="min-width:0"><h3>${tx(s.name)}</h3><div class="sci">${s.sci}</div><dl class="kv"><dt>${t('kvStatus')}</dt><dd>${badge(s)}</dd><dt>${t('kvMap')}</dt><dd>${t('map')[s.map]}</dd><dt>${t('kvReg')}</dt><dd>${tx(s.reg)} <span class="hint">${t('regNote')}</span></dd>${price}<dt>${t('kvFound')}</dt><dd class="num">${S.codex[id]}</dd></dl></div></div><p class="note" style="margin:12px 0 0">${tx(s.note)}</p>`;
   }
   return (isNew?`<div class="ribbon">${t('newFound')}</div>`:'')+hdr(known?tx(s.name):t('unknown'))+`<div class="sb">${body}<div style="margin-top:14px;text-align:right"><button class="btn" type="button" data-close>${t('close')}</button></div></div>`}});

function openShop(){
 if(findModal('shop'))return;
 openModal({kind:'shop',narrow:true,tab:'sell',
  render:m=>{
   const tabs=`<div class="tabs" role="tablist"><button class="tab" type="button" role="tab" data-tab="sell" aria-selected="${m.tab==='sell'}">${t('sellTab')}</button><button class="tab" type="button" role="tab" data-tab="ing" aria-selected="${m.tab==='ing'}">${t('ingTab')}</button><button class="tab" type="button" role="tab" data-tab="up" aria-selected="${m.tab==='up'}">${t('upTab')}</button></div>`;
   if(m.tab==='ing')return hdr(t('shopTitle'),`<span class="num coin">${S.money}</span>`)+`<div class="sb">${tabs}<p class="note" style="margin:0 0 10px">${t('ingSay')}</p>${homeStockRows()}</div>`;
   if(m.tab==='up')return hdr(t('shopTitle'),`<span class="num coin">${S.money}</span>`)+`<div class="sb">${tabs}<p class="note" style="margin:0 0 10px">${t('upSay')}</p>${upgradeRows()}</div>`;
   const ids=SP.filter(s=>!s.edible&&S.bag[s.id]);
   const rows=ids.map(s=>{const p=priceOf(s.id),up=(MK.mult[s.id]||1)>=(MK.prev[s.id]||1);
    return `<div class="row">${img(s.id,40)}<div class="grow"><b>${tx(s.name)}</b> ×<span class="num">${S.bag[s.id]}</span><small>${t('priceNow')} <b class="num" style="color:${up?'var(--ok)':'var(--danger)'}">${p}</b> ${up?'▲':'▼'}</small></div><button class="btn sm" type="button" data-sell="${s.id}">${t('sell1')}</button><button class="btn ghost sm" type="button" data-sellall="${s.id}">${t('sellAll')}</button></div>`}).join('');
   return hdr(t('shopTitle'),`<span class="num coin">${S.money}</span>`)+`<div class="sb">${tabs}<p class="note" style="margin:0 0 10px">${t('shopSay')}</p>${rows||`<div class="empty">${t('nothingSell')}</div>`}${ids.length?`<div style="margin-top:12px;text-align:right"><button class="btn" type="button" data-all>${t('sellEverything')}</button></div>`:''}</div>`},
  click:(e,m)=>{
   const tb=e.target.closest('[data-tab]');if(tb){m.tab=tb.dataset.tab;m.draw();sfx('tick');return}
   const hb=e.target.closest('[data-hbuy]');if(hb){buyHome(hb.dataset.hbuy);m.draw();return}
   const ub=e.target.closest('[data-up]');if(ub){buyUpgrade(ub.dataset.up);m.draw();return}
   const sell=(id,n)=>{const have=S.bag[id]||0;n=Math.min(n,have);if(n<=0)return 0;let c=0;for(let i=0;i<n;i++)c+=priceOf(id);S.bag[id]-=n;if(S.bag[id]<=0)delete S.bag[id];S.money+=c;S.sold+=n;return c};
   const a=e.target.closest('[data-sell]'),b=e.target.closest('[data-sellall]'),c=e.target.closest('[data-all]');let got=0,name='',cnt=0;
   if(a){got=sell(a.dataset.sell,1);cnt=1;name=tx(SPM[a.dataset.sell].name)}
   else if(b){const id=b.dataset.sellall;cnt=S.bag[id]||0;got=sell(id,cnt);name=tx(SPM[id].name)}
   else if(c){SP.filter(s=>!s.edible&&S.bag[s.id]).forEach(s=>{cnt+=S.bag[s.id];got+=sell(s.id,S.bag[s.id])});name=t('bagTitle')}
   if(got){toast(t('sold',name+(cnt>1?' ×'+cnt:''),got),'gold');sfx('coin');save();hud();m.draw()}}});
}

/* ============ kitchen ============ */
let K=null,kitRAF=0;
const PCOL={butter:'#ffe27a',garlic:'#f5f0e0',salt:'#ffffff',egg:'#ffd23a',crumb:'#d8a860',cream:'#fff6e8',pasta:'#f0d890',rice:'#f8f8f0',wine:'#e8e090',soy:'#4a2a1a',ginger:'#e8c870',scallion:'#6ac850',vinegar:'#c8a060',chicken:'#f0c8a0',sugar:'#f0e8d8',jujube:'#a83a2a',flour:'#f4f0e8',tomato:'#e8523f',cheese:'#ffd23a',lemon:'#f0e050',chili:'#d83a2a',miso:'#c89a50',tofu:'#f8f4e8',noodle:'#f0d890',coconut:'#fffaf0'};
function evaluate(r,A,oil,heat){
 let sIng=0,exact=true;
 r.items.forEach(([k,ideal])=>{const d=Math.abs((A[k]||0)-ideal);if(d)exact=false;sIng+=Math.max(0,1-d/Math.max(1,ideal)*.9)/r.items.length});
 const od=Math.abs(oil-r.oil);if(od>5)exact=false;const oilS=Math.max(0,1-od/55);
 const hd=Math.abs(heat-r.heat);if(hd)exact=false;const heatS=Math.max(0,1-hd*.32);
 const score=Math.round(sIng*45+oilS*25+heatS*30);
 return {score,perfect:exact};
}
function critique(r,A,oil,heat){
 const sp=SPM[r.sp],F=t('fb'),out=[];
 r.items.forEach(([k,ideal])=>{const d=(A[k]||0)-ideal;if(!d)return;const nm=k==='M'?tx(sp.name):tx(PAN[k][0]);const big=Math.abs(d)>=2;out.push({w:Math.abs(d)/Math.max(1,ideal)+.1,t:d<0?F.less(nm,big):F.more(nm,big)})});
 const od=oil-r.oil;if(Math.abs(od)>5)out.push({w:Math.abs(od)/50+.1,t:od>0?F.oilHi(od>25):F.oilLo(od<-25)});
 const hd=heat-r.heat;if(hd)out.push({w:Math.abs(hd)*.35,t:hd>0?F.heatHi(hd>1):F.heatLo(hd<-1)});
 out.sort((a,b)=>b.w-a.w);return out.slice(0,2).map(o=>o.t);
}
function openKitchen(){
 if(findModal('kitchen'))return;
 K={rid:null,A:{},oil:50,heat:3,phase:'setup',res:null};
 const m=openModal({kind:'kitchen',kitchen:true,
  locked:()=>K&&K.phase==='cooking',
  onClose:()=>{K=null},
  render:()=>{
   const lvNow=lvOf(S.exp||0);const list=RC.map(r=>{if(r.lv>lvNow)return `<div class="rbtn off"><span>${t('unknown')}</span><small>${t('lockRec',r.lv)}</small></div>`;const have=S.bag[r.sp]||0;return `<button class="rbtn ${have?'':'off'}" type="button" data-r="${r.id}" aria-pressed="${K.rid===r.id}"><span>${S.perfect[r.id]?'<span class="st">★</span> ':''}${tx(r.name)}</span><small>${tx(SPM[r.sp].name)} ×${have}</small></button>`}).join('');
   const body=K.phase==='result'?resultHTML():K.rid?cookHTML():`<div class="empty">${t('kitPick')}</div>`;
   return hdr(t('kitTitle'),`<span class="num coin">${S.money}</span>`)+`<div class="sb"><div class="kgrid"><div class="rlist">${list}</div><div id="kmain" class="${K.phase==='cooking'?'cooking':''}">${body}</div></div></div>`},
  after:()=>{},
  click:(e,m)=>{
   if(K.phase==='cooking')return;
   const rb=e.target.closest('[data-r]');
   if(rb){selectRecipe(rb.dataset.r);m.draw();return}
   const hb=e.target.closest('[data-heat]');if(hb){K.heat=+hb.dataset.heat;heatSfx(K.heat);m.draw();return}
   if(e.target.closest('[data-apply]')){const r=RCM[K.rid],have=S.bag[r.sp]||0;r.items.forEach(([k,ideal])=>{K.A[k]=Math.min(ideal,ingMax(k))});K.oil=r.oil;K.heat=r.heat;m.draw();return}
   if(e.target.closest('[data-cook]')){startCook(m);return}
   if(e.target.closest('[data-again]')){K.phase='setup';K.res=null;clampAmounts();m.draw();return}
   if(e.target.closest('[data-other]')){K.phase='setup';K.res=null;K.rid=null;m.draw()}},
  input:(e,m)=>{
   const el=e.target;if(!K||K.phase==='cooking')return;
   if(el.dataset.k){const k=el.dataset.k;tickAt(+el.value);K.A[k]=+el.value;const o=$('o-'+k);if(o)o.textContent=fmtAmt(k,+el.value)}
   else if(el.id==='s-oil'){tickAt(+el.value/10);K.oil=+el.value;$('o-oil').textContent=el.value+'%'}}});
 if(!kitRAF)kitRAF=requestAnimationFrame(kitLoop);
 return m;
}
function fmtAmt(k,v){const u=k==='M'?unitM():tx(PAN[k][1]);return v+(u?' '+u:'')}
function selectRecipe(id){
 K.rid=id;K.phase='setup';K.res=null;const r=RCM[id],have=S.bag[r.sp]||0;K.A={};
 r.items.forEach(([k])=>{K.A[k]=k==='M'?Math.min(have,3):Math.min(1,ingMax(k))});K.oil=50;K.heat=3;
}
function clampAmounts(){const r=RCM[K.rid],have=S.bag[r.sp]||0;K.A.M=Math.min(K.A.M||0,Math.min(12,have))}
function cookHTML(){
 const r=RCM[K.rid],sp=SPM[r.sp],have=S.bag[r.sp]||0,perf=!!S.perfect[r.id];
 if(have<1)return `<h3 style="margin:0 0 6px">${tx(r.name)}</h3><p class="hint">${t('kitNeed',tx(sp.name))}</p>`;
 const miss=r.items.filter(([k,ideal])=>k!=='M'&&(S.pantry[k]||0)<ideal).map(([k,ideal])=>tx(PAN[k][0])+' '+(S.pantry[k]||0)+'/'+ideal);
 if(miss.length)return `<h3 style="margin:0 0 6px">${tx(r.name)}</h3><p class="hint">${t('needIng',miss.join(lang==='zh'?'、':', '))}</p>`;
 const rows=r.items.map(([k,ideal])=>{
